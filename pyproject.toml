[project]
name = "path_planning"
version = "0.1.0"
description = "Kinodynamic A* path planner cho robot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "shapely",
    "matplotlib",
    "nats-py>=2.12.0",
    "protobuf>=5.0.0",
    "typing_extensions>=4.0; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/path_planning", "src/service"]

[tool.ruff]
target-version = "py310"
line-length = 88
indent-width = 4
src = ["src", "tests", "scripts"]

extend-exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "docs",
    "src/service/idl",
    "src/service/vtx_service/proto",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 80

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "D", "UP", "B", "SIM", "S", "ASYNC", "RUF", "ANN", "C4"
]
ignore = [
    "D100", "D104", "D107", "B008", "RUF001", "RUF002", "RUF003", "D203", "D213"
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["path_planning", "service", "scripts"]
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "D", "ANN", "ARG", "S105", "S106", "S603", "S607", "N806", "C408", "E501", "E402", "E741", "RUF059", "N802", "RUF005", "B905", "RUF007", "B018", "SIM", "S311", "N803", "F841"]
"**/*_test.py" = ["S101", "D", "ANN", "ARG", "S105", "S106", "S603", "S607", "N806", "C408", "E501", "E402", "E741", "RUF059", "N802", "RUF005", "B905", "RUF007", "B018", "SIM", "S311", "N803", "F841"]
"scripts/**" = ["D", "ANN", "S101", "S311", "T201", "E501", "N806", "E741"]
"**/*.ipynb" = ["D", "ANN", "E501", "T201", "B905"]
"cases/**" = ["D", "ANN"]
"src/path_planning/scenario/generator.py" = ["S311"]
"src/service/vtx_service/transport.py" = ["E402"]
"src/service/vtx_service/map_file.py" = ["S314"]
"src/service/vtx_service/runner.py" = ["S101"]
"src/service/vtx_service/runtime.py" = ["S607"]
"src/service/spike/**" = ["E402", "ANN", "S101"]

[tool.pyright]
include = ["src"]
exclude = [
    "**/__pycache__",
    ".venv",
    "dist",
    "build",
    "src/service/idl",
    "src/service/vtx_service/proto",
]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
reportMissingTypeStubs = false
reportMissingParameterType = "error"
reportUnknownMemberType = "warning"
reportUntypedBaseClass = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"

[[tool.pyright.executionEnvironments]]
root = "src/path_planning/render"
extraPaths = ["src"]
reportUnknownMemberType = false
reportUnknownArgumentType = false

[[tool.pyright.executionEnvironments]]
root = "src/service"
extraPaths = ["src"]
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportArgumentType = false
reportGeneralTypeIssues = false
reportUntypedBaseClass = false
reportMissingTypeArgument = false
reportIndexIssue = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
reportReturnType = false
reportUnnecessaryTypeIgnoreComment = false

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["src", "tests"]
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportArgumentType = false
reportGeneralTypeIssues = false
reportUntypedBaseClass = false
reportMissingTypeArgument = false
reportIndexIssue = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
reportReturnType = false
reportUnnecessaryTypeIgnoreComment = false
reportPrivateUsage = false
reportTypedDictNotRequiredAccess = false
reportAssignmentType = false
reportUnknownParameterType = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Kiểm thử đơn vị",
    "integration: Kiểm thử tích hợp",
    "e2e: Kiểm thử End-to-End",
    "slow: Các bài test nặng",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
xfail_strict = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
